<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 120" width="800" height="120">
  <!-- Background -->
  <rect width="800" height="120" fill="#0d1117" rx="8"/>
  
  <!-- Grid pattern -->
  <g opacity="0.1">
    <line x1="0" y1="30" x2="800" y2="30" stroke="#ffeb3b" stroke-width="0.5" stroke-dasharray="4,4"/>
    <line x1="0" y1="60" x2="800" y2="60" stroke="#ffeb3b" stroke-width="0.5" stroke-dasharray="4,4"/>
    <line x1="0" y1="90" x2="800" y2="90" stroke="#ffeb3b" stroke-width="0.5" stroke-dasharray="4,4"/>
    <line x1="100" y1="0" x2="100" y2="120" stroke="#ffeb3b" stroke-width="0.5" stroke-dasharray="4,4"/>
    <line x1="200" y1="0" x2="200" y2="120" stroke="#ffeb3b" stroke-width="0.5" stroke-dasharray="4,4"/>
    <line x1="300" y1="0" x2="300" y2="120" stroke="#ffeb3b" stroke-width="0.5" stroke-dasharray="4,4"/>
    <line x1="400" y1="0" x2="400" y2="120" stroke="#ffeb3b" stroke-width="0.5" stroke-dasharray="4,4"/>
    <line x1="500" y1="0" x2="500" y2="120" stroke="#ffeb3b" stroke-width="0.5" stroke-dasharray="4,4"/>
    <line x1="600" y1="0" x2="600" y2="120" stroke="#ffeb3b" stroke-width="0.5" stroke-dasharray="4,4"/>
    <line x1="700" y1="0" x2="700" y2="120" stroke="#ffeb3b" stroke-width="0.5" stroke-dasharray="4,4"/>
  </g>
  
  <!-- Title -->
  <text x="400" y="25" text-anchor="middle" fill="#ffeb3b" font-family="monospace" font-size="16" font-weight="bold">
    <tspan>🎮 Pac-Man Comendo Meus Commits</tspan>
  </text>
  
  <!-- Pac-Man body -->
  <g>
    <animateTransform attributeName="transform" type="translate" from="50,60" to="750,60" dur="8s" repeatCount="indefinite"/>
    
    <!-- Pac-Man mouth animation -->
    <path fill="#ffeb3b" d="M 50 60 A 30 30 0 0 1 50 60 A 30 30 0 0 1 50 60 Z">
      <animate attributeName="d" dur="0.5s" repeatCount="indefinite" calcMode="paced"
        values="
          M 50 60 A 30 30 0 0 1 50 90 A 30 30 0 0 1 50 60 Z;
          M 50 60 L 80 60 L 50 30 Z;
          M 50 60 L 80 60 L 50 90 Z;
          M 50 60 A 30 30 0 0 1 50 90 A 30 30 0 0 1 50 60 Z
        "/>
    </path>
    
    <!-- Pac-Man eye -->
    <circle cx="42" cy="48" r="3" fill="#0d1117"/>
  </g>
  
  <!-- Commit dots (being eaten) -->
  <!-- JavaScript commit (yellow) -->
  <circle cx="150" cy="60" r="8" fill="#f1e05a">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.125;0.135;1" dur="8s" repeatCount="indefinite" begin="1s"/>
    <animate attributeName="r" values="8;8;0;0" keyTimes="0;0.125;0.135;1" dur="8s" repeatCount="indefinite" begin="1s"/>
  </circle>
  <text x="150" y="80" text-anchor="middle" fill="#f1e05a" font-family="monospace" font-size="8" opacity="0.8">JS</text>
  
  <!-- Python commit (blue) -->
  <circle cx="250" cy="60" r="8" fill="#3572A5">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.25;0.26;1" dur="8s" repeatCount="indefinite" begin="2s"/>
    <animate attributeName="r" values="8;8;0;0" keyTimes="0;0.25;0.26;1" dur="8s" repeatCount="indefinite" begin="2s"/>
  </circle>
  <text x="250" y="80" text-anchor="middle" fill="#3572A5" font-family="monospace" font-size="8" opacity="0.8">PY</text>
  
  <!-- CSS commit (pink) -->
  <circle cx="350" cy="60" r="8" fill="#563d7c">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.375;0.385;1" dur="8s" repeatCount="indefinite" begin="3s"/>
    <animate attributeName="r" values="8;8;0;0" keyTimes="0;0.375;0.385;1" dur="8s" repeatCount="indefinite" begin="3s"/>
  </circle>
  <text x="350" y="80" text-anchor="middle" fill="#563d7c" font-family="monospace" font-size="8" opacity="0.8">CSS</text>
  
  <!-- Markdown commit (white) -->
  <circle cx="450" cy="60" r="8" fill="#fff">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.51;1" dur="8s" repeatCount="indefinite" begin="4s"/>
    <animate attributeName="r" values="8;8;0;0" keyTimes="0;0.5;0.51;1" dur="8s" repeatCount="indefinite" begin="4s"/>
  </circle>
  <text x="450" y="80" text-anchor="middle" fill="#fff" font-family="monospace" font-size="8" opacity="0.8">MD</text>
  
  <!-- HTML commit (orange) -->
  <circle cx="550" cy="60" r="8" fill="#e34c26">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.625;0.635;1" dur="8s" repeatCount="indefinite" begin="5s"/>
    <animate attributeName="r" values="8;8;0;0" keyTimes="0;0.625;0.635;1" dur="8s" repeatCount="indefinite" begin="5s"/>
  </circle>
  <text x="550" y="80" text-anchor="middle" fill="#e34c26" font-family="monospace" font-size="8" opacity="0.8">HTML</text>
  
  <!-- Git commit (red) -->
  <circle cx="650" cy="60" r="8" fill="#f05032">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.75;0.76;1" dur="8s" repeatCount="indefinite" begin="6s"/>
    <animate attributeName="r" values="8;8;0;0" keyTimes="0;0.75;0.76;1" dur="8s" repeatCount="indefinite" begin="6s"/>
  </circle>
  <text x="650" y="80" text-anchor="middle" fill="#f05032" font-family="monospace" font-size="8" opacity="0.8">GIT</text>
  
  <!-- Ghost chasing Pac-Man -->
  <g>
    <animateTransform attributeName="transform" type="translate" from="780,60" to="30,60" dur="10s" repeatCount="indefinite"/>
    
    <!-- Ghost body -->
    <path fill="#ff6b6b" d="M -15 -15 A 15 15 0 0 1 15 -15 L 15 10 L 10 5 L 5 10 L 0 5 L -5 10 L -10 5 L -15 10 L -15 -15 Z"/>
    
    <!-- Ghost eyes -->
    <circle cx="-5" cy="-5" r="4" fill="#fff"/>
    <circle cx="5" cy="-5" r="4" fill="#fff"/>
    <circle cx="-4" cy="-4" r="2" fill="#333"/>
    <circle cx="6" cy="-4" r="2" fill="#333"/>
    
    <!-- Ghost mouth -->
    <path fill="#333" d="M -5 5 Q 0 8 5 5" stroke="#333" stroke-width="1" fill="none"/>
  </g>
  
  <!-- Score display -->
  <text x="400" y="108" text-anchor="middle" fill="#ffeb3b" font-family="monospace" font-size="12" opacity="0.6">
    <tspan>SCORE: 4 commits eaten</tspan>
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
  </text>
</svg>
