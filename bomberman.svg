<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="600" height="200">
  <defs>
    <style>
      @keyframes explode {
        0%, 60% { opacity: 1; transform: scale(1); }
        70% { opacity: 0.8; transform: scale(1.3); }
        100% { opacity: 0; transform: scale(2); }
      }
      @keyframes bounce {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-5px); }
      }
      @keyframes pulse {
        0%, 100% { fill: #ff0000; }
        50% { fill: #ff4444; }
      }
      .bomb { animation: explode 3s infinite; }
      .bomberman { animation: bounce 2s infinite; }
      .spark { animation: pulse 0.5s infinite; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="600" height="200" fill="#1a1a2e" rx="8"/>
  
  <!-- Grid pattern (Bomberman game floor) -->
  <g fill="#16213e" opacity="0.3">
    <rect x="0" y="0" width="30" height="30"/>
    <rect x="60" y="0" width="30" height="30"/>
    <rect x="120" y="0" width="30" height="30"/>
    <rect x="180" y="0" width="30" height="30"/>
    <rect x="240" y="0" width="30" height="30"/>
    <rect x="300" y="0" width="30" height="30"/>
    <rect x="360" y="0" width="30" height="30"/>
    <rect x="420" y="0" width="30" height="30"/>
    <rect x="480" y="0" width="30" height="30"/>
    <rect x="540" y="0" width="30" height="30"/>
    <rect x="30" y="30" width="30" height="30"/>
    <rect x="90" y="30" width="30" height="30"/>
    <rect x="150" y="30" width="30" height="30"/>
    <rect x="210" y="30" width="30" height="30"/>
    <rect x="270" y="30" width="30" height="30"/>
    <rect x="330" y="30" width="30" height="30"/>
    <rect x="390" y="30" width="30" height="30"/>
    <rect x="450" y="30" width="30" height="30"/>
    <rect x="510" y="30" width="30" height="30"/>
  </g>
  
  <!-- Bomberman Character -->
  <g class="bomberman" transform="translate(250, 80)">
    <!-- Body (white round body) -->
    <ellipse cx="0" cy="20" rx="35" ry="40" fill="#ffffff" stroke="#000" stroke-width="2"/>
    
    <!-- Head -->
    <ellipse cx="0" cy="-15" rx="30" ry="28" fill="#ffffff" stroke="#000" stroke-width="2"/>
    
    <!-- Red helmet -->
    <path d="M -28 -25 Q -30 -55 0 -60 Q 30 -55 28 -25" fill="#e60012" stroke="#000" stroke-width="2"/>
    
    <!-- White pom-pom on top -->
    <circle cx="0" cy="-62" r="8" fill="#ffffff" stroke="#000" stroke-width="1.5"/>
    
    <!-- Eyes (blue, big) -->
    <ellipse cx="-12" cy="-18" rx="8" ry="10" fill="#4a90d9" stroke="#000" stroke-width="1.5"/>
    <ellipse cx="12" cy="-18" rx="8" ry="10" fill="#4a90d9" stroke="#000" stroke-width="1.5"/>
    <circle cx="-12" cy="-18" r="3" fill="#000"/>
    <circle cx="12" cy="-18" r="3" fill="#000"/>
    
    <!-- Mustache (black) -->
    <path d="M -20 -5 Q -10 -8 0 -5 Q 10 -8 20 -5" fill="none" stroke="#000" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Belt (blue) -->
    <rect x="-25" y="10" width="50" height="6" fill="#2c5aa0" stroke="#000" stroke-width="1"/>
    
    <!-- Gloves (white) -->
    <circle cx="-40" cy="25" r="10" fill="#ffffff" stroke="#000" stroke-width="2"/>
    <circle cx="40" cy="25" r="10" fill="#ffffff" stroke="#000" stroke-width="2"/>
    
    <!-- Boots (brown) -->
    <ellipse cx="-18" cy="58" rx="12" ry="6" fill="#8b4513" stroke="#000" stroke-width="1.5"/>
    <ellipse cx="18" cy="58" rx="12" ry="6" fill="#8b4513" stroke="#000" stroke-width="1.5"/>
  </g>
  
  <!-- Bomb -->
  <g class="bomb" transform="translate(380, 100)">
    <circle cx="0" cy="0" r="15" fill="#1a1a1a" stroke="#000" stroke-width="2"/>
    <circle cx="0" cy="0" r="10" fill="#333" opacity="0.5"/>
    <line x1="0" y1="-15" x2="5" y2="-22" stroke="#8b4513" stroke-width="2"/>
    <circle cx="5" cy="-22" r="3" fill="#ff6600" class="spark"/>
  </g>
  
  <!-- Explosion effect -->
  <g class="bomb" transform="translate(450, 100)">
    <circle cx="0" cy="0" r="25" fill="none" stroke="#ff4400" stroke-width="3" opacity="0.8"/>
    <circle cx="0" cy="0" r="15" fill="none" stroke="#ffaa00" stroke-width="2" opacity="0.6"/>
    <circle cx="0" cy="0" r="8" fill="#ff6600" opacity="0.4"/>
  </g>
  
  <!-- Title text -->
  <text x="300" y="170" text-anchor="middle" font-family="monospace" font-size="18" fill="#ffffff" font-weight="bold">
    💣 Bomberman Explodindo Meus Commits!
  </text>
</svg>